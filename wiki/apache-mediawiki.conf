ServerName wiki.example.org

<Directory /var/www/html>
    Options FollowSymLinks
    AllowOverride None
    Require all granted
    RewriteEngine On
    RewriteRule ^Wiki/(.*)$ /index.php?title=$1 [B,L,QSA]
</Directory>

<FilesMatch "^(LocalSettings\.php|\.env)$">
    Require all denied
</FilesMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set X-Frame-Options "SAMEORIGIN"

# Prevent direct public access to uploads; img_auth.php serves them after login.
<Directory /var/www/html/images>
    Require all denied
</Directory>
